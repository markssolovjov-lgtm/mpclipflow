# MP ClipFlow — инфраструктура для разработки и self-hosted развёртывания.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipflow
      POSTGRES_PASSWORD: clipflow
      POSTGRES_DB: clipflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipflow"]
      interval: 5s
      retries: 10

  # Опционально: S3-совместимое хранилище для больших исходников (STORAGE_DRIVER=s3).
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipflow
      MINIO_ROOT_PASSWORD: clipflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  app:
    build: .
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://clipflow:clipflow@postgres:5432/clipflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  miniodata:
  appdata:
